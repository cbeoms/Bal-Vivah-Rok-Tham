<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1,
        maximum-scale=1, minimum-scale=1,
        user-scalable=no, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="theme-color" content="#2563eb">

  <title>Activity Photo Collection</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #2563eb;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .loading {
      text-align: center;
      color: white;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="loading">

    <div class="spinner"></div>

    <div class="loading-text">
      Opening Activity Photo Collection...
    </div>

  </div>


  <script>

    const APP_URL =
      "https://script.google.com/a/~/macros/s/AKfycbzT0yUXCJl9OjO7jt9oVEHl9iB0KB2lsRCtwERmUE0QRHr8Shx68M__fOkylZ7a_Rjr/exec";


    // Open Apps Script directly.
    window.location.replace(APP_URL);

  </script>

</body>
</html>
